[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to the LLM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "llm-sdk",
    # torch is already pulled in transitively by llm_sdk; it is declared here
    # only so its source can be pinned to the CPU-only build (see
    # [tool.uv.sources]).
    "torch",
]

# Development-only dependencies (installed by `uv sync`). Not required to run
# the project, only for linting and tests.
[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.8",
    "pytest>=8.0",
]

[tool.uv]
# The project runs via `uv run python -m src`; it is not installed as a package.
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }
# torch is pulled in by llm_sdk. By default uv downloads the CUDA build, which
# brings several GB of nvidia-* wheels that are useless here (the machine runs
# on CPU). Pin it to the CPU-only build from PyTorch's official index.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
# The llm_sdk package lives at ./llm_sdk/llm_sdk; without this, mypy resolves
# the import against the containing folder ./llm_sdk (which is not the package).
mypy_path = "llm_sdk"
explicit_package_bases = true
# `mypy .` (as the subject spells the lint command) would otherwise try to
# type-check third-party / generated trees. Only our code is ours to fix.
exclude = ['^\.venv/', '^llm_sdk/', '^build/', '^dist/']

# numpy 2.x ships stubs that use Python 3.12 syntax (`type X = ...`), which mypy
# cannot parse under python_version = "3.10". We don't want to type-check numpy's
# internals, so skip them.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
