[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduccion a la llamada de funciones en LLMs mediante decodificacion restringida (42)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "llm-sdk",
]

# Dependencias solo de desarrollo (uv las instala con `uv sync`).
# No hacen falta para ejecutar el proyecto, pero si para lint y tests.
[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.8",
    "pytest>=8.0",
]

[tool.uv]
# El proyecto se ejecuta con `uv run python -m src`, no se instala como paquete.
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
# El paquete llm_sdk vive en ./llm_sdk/llm_sdk; sin esto mypy resuelve
# el import contra la carpeta contenedora ./llm_sdk (que no es el paquete).
mypy_path = "llm_sdk"
explicit_package_bases = true

# Los stubs de numpy 2.x usan sintaxis de Python 3.12 (`type X = ...`) que
# mypy no sabe parsear con python_version = "3.10". No queremos type-checkear
# las tripas de numpy, asi que las saltamos.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
